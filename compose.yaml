name: werkfaden

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: werkfaden
      POSTGRES_PASSWORD: ${WORKWEAR_DB_PASSWORD:?Run npm run setup:env first}
      POSTGRES_DB: werkfaden_dev
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werkfaden -d werkfaden_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6384:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
